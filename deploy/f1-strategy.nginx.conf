# Independent virtual host; Tidewatch remains nginx's default server.
server_names_hash_bucket_size 128;
limit_conn_zone $server_name zone=f1_connections:1m;
limit_req_zone $binary_remote_addr zone=f1_requests:1m rate=10r/s;

server {
    listen 80;
    server_name ec2-13-62-14-125.eu-north-1.compute.amazonaws.com;
    client_max_body_size 2m;
    access_log /var/log/nginx/f1-strategy.access.log;
    error_log /var/log/nginx/f1-strategy.error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        limit_req zone=f1_requests burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # Bound expensive requests across all clients to protect the shared VM.
    location ~ ^/api/(simulate|rival-analysis|undercut|overcut|rival/compare-plot|backtest) {
        limit_conn f1_connections 1;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }
}
